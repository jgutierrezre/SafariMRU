name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: xcodebuild -version

      # Signs with the project's stable self-signed identity so that users keep
      # their Accessibility / Screen Recording grants across updates. Falls back
      # to ad-hoc signing when the secrets are not configured.
      - name: Import signing identity
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "No signing certificate configured; building ad-hoc."
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN" >/dev/null

          # A self-signed certificate must be trusted locally before codesign
          # will accept it as an identity.
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys \
            -out "$RUNNER_TEMP/cert.pem" -passin "pass:$CERT_PASSWORD"
          security add-trusted-cert -r trustRoot -k "$KEYCHAIN" "$RUNNER_TEMP/cert.pem"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"
          echo "SIGN_IDENTITY=SafariMRU Self-Signed" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build release zip
        run: |
          set -o pipefail
          Scripts/build-release.sh "${{ steps.v.outputs.version }}" | tail -40

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: SafariMRU-${{ steps.v.outputs.version }}
          path: dist/*.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip \
              --title "Safari MRU ${TAG#v}" \
              --notes-file .github/release-notes.md \
              --verify-tag
          fi
